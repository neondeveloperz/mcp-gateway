name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows"
            platform: "windows-latest"
            args: "--bundles nsis"
            rustTargets: ""
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            portableUpload: true
          - name: "macOS Apple Silicon"
            platform: "macos-latest"
            args: "--target aarch64-apple-darwin --bundles dmg"
            rustTargets: "aarch64-apple-darwin"
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            portableUpload: false
          - name: "macOS Intel"
            platform: "macos-latest"
            args: "--target x86_64-apple-darwin --bundles dmg"
            rustTargets: "x86_64-apple-darwin"
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            portableUpload: false
          - name: "Linux"
            platform: "ubuntu-22.04"
            args: "--bundles appimage,deb"
            rustTargets: ""
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            portableUpload: false
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: Install frontend dependencies
        run: bun install

      - name: Build and publish
        id: tauri
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: |
            See the assets below to download this version.
            The Windows portable executable requires the Microsoft Edge WebView2 Runtime.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          retryAttempts: 2
          args: ${{ matrix.args }}
          assetNamePattern: ${{ matrix.assetPattern }}
          uploadPlainBinary: ${{ matrix.uploadPlainBinary }}
          includeUpdaterJson: false

      - name: Upload Windows portable executable
        if: matrix.portableUpload
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $metadata = cargo metadata --manifest-path "src-tauri/Cargo.toml" --no-deps --format-version 1 | ConvertFrom-Json
          $binaryTarget = $metadata.packages[0].targets |
            Where-Object { $_.kind -contains "bin" } |
            Select-Object -First 1

          if (-not $binaryTarget) {
            throw "Could not determine the Windows binary target from Cargo metadata."
          }

          $binaryPath = Join-Path "src-tauri/target/release" "$($binaryTarget.name).exe"
          if (-not (Test-Path -LiteralPath $binaryPath)) {
            $binaryPath = Join-Path "target/release" "$($binaryTarget.name).exe"
          }
          if (-not (Test-Path -LiteralPath $binaryPath)) {
            throw "Portable executable was not found at $binaryPath."
          }

          $safeProductName = ($config.productName -replace '[^A-Za-z0-9._-]+', '-').Trim('-')
          $version = "${{ steps.tauri.outputs.appVersion }}"
          $assetName = "$safeProductName-$version-windows-x64-portable.exe"
          $assetPath = Join-Path $env:RUNNER_TEMP $assetName

          Copy-Item -LiteralPath $binaryPath -Destination $assetPath
          gh release upload "v$version" $assetPath --clobber

      - name: Build and Package CLI executable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.tauri.outputs.appVersion }}"
          if [ -z "$VERSION" ]; then
            VERSION="0.2.1"
          fi

          if [ -n "${{ matrix.rustTargets }}" ]; then
            cargo build --release -p mcp-gateway-cli --target ${{ matrix.rustTargets }}
            if [ -d "target/${{ matrix.rustTargets }}/release" ]; then
              BIN_DIR="target/${{ matrix.rustTargets }}/release"
            else
              BIN_DIR="src-tauri/target/${{ matrix.rustTargets }}/release"
            fi
          else
            cargo build --release -p mcp-gateway-cli
            if [ -d "target/release" ]; then
              BIN_DIR="target/release"
            else
              BIN_DIR="src-tauri/target/release"
            fi
          fi

          if [ "${{ runner.os }}" = "Windows" ]; then
            CLI_BIN="$BIN_DIR/mcp-gateway-cli.exe"
            ZIP_NAME="mcp-gateway-cli-v${VERSION}-windows-x64.zip"
            7z a "$RUNNER_TEMP/$ZIP_NAME" "$CLI_BIN"
            gh release upload "v$VERSION" "$RUNNER_TEMP/$ZIP_NAME" --clobber
            cp "$CLI_BIN" "$RUNNER_TEMP/mcp-gateway-cli-v${VERSION}-windows-x64.exe"
            gh release upload "v$VERSION" "$RUNNER_TEMP/mcp-gateway-cli-v${VERSION}-windows-x64.exe" --clobber
          else
            CLI_BIN="$BIN_DIR/mcp-gateway-cli"
            chmod +x "$CLI_BIN"
            if [ "${{ matrix.name }}" = "Linux" ]; then
              ARCH_NAME="linux-x64"
            elif [ "${{ matrix.name }}" = "macOS Apple Silicon" ]; then
              ARCH_NAME="darwin-arm64"
            else
              ARCH_NAME="darwin-x64"
            fi
            TAR_NAME="mcp-gateway-cli-v${VERSION}-${ARCH_NAME}.tar.gz"
            tar -czf "$RUNNER_TEMP/$TAR_NAME" -C "$BIN_DIR" mcp-gateway-cli
            gh release upload "v$VERSION" "$RUNNER_TEMP/$TAR_NAME" --clobber
          fi

      - name: Release summary
        if: steps.tauri.outputs.releaseHtmlUrl != ''
        shell: bash
        run: |
          {
            echo "## Tauri Release"
            echo ""
            echo "- Platform: \`${{ matrix.name }}\`"
            echo "- Version: \`${{ steps.tauri.outputs.appVersion }}\`"
            echo "- Release: ${{ steps.tauri.outputs.releaseHtmlUrl }}"
            echo "- Artifacts: \`${{ steps.tauri.outputs.artifactPaths }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
