services:
  mcp-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-gateway-core
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MCP_GATEWAY_PORT=8080
      - MCP_GATEWAY_HOST=0.0.0.0
    volumes:
      - ./data:/home/gatewayuser/.mcp_gateway
